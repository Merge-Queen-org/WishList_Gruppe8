name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
         - uses: JetBrains/qodana-action@v2026.2
