<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wish List</title>
  <link rel="stylesheet" href="wishlist.css">
</head>
<body>

<header>
  <h1>Wish List</h1>
  <p>Make a list and share it with your family and friends.</p>
</header>

<main>
  <aside>
    <section class="panel" aria-labelledby="new-list-title">
      <h2 id="new-list-title">New Wish List</h2>
      <form id="list-form">
        <label for="list-title">Titel</label>
        <input id="list-title" required maxlength="60" placeholder="F.eks. Fødselsdag 2026">
        <label for="list-owner">Your Name</label>
        <input id="list-owner" required maxlength="40" placeholder="F.eks. Mette">
        <button class="primary" type="submit">Create Wish List</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="my-lists-title">
      <h2 id="my-lists-title">Mine Wish Lists</h2>
      <ul class="list-nav" id="list-nav"></ul>
    </section>
  </aside>

  <section id="detail"></section>
</main>


</body>
</html>
