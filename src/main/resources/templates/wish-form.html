<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add wish</title>
    <link rel="stylesheet" th:href="@{/create.css}">
</head>
<body>

<main class="create-page">
    <h2>Add a wish</h2>

    <form class="form-card" th:action="@{/wishlist/{id}/wishes(id=${wishList.wishList_id})}" th:object="${wish}" method="post">
        <label for="wish_name">Name</label>
        <input type="text" id="wish_name" th:field="*{wish_name}" required>

        <label for="wish_description">Description (optional)</label>
        <textarea id="wish_description" th:field="*{wish_description}"></textarea>

        <label for="link">Link (optional)</label>
        <input type="text" id="link" th:field="*{link}">

        <label for="price">Price (optional)</label>
        <input type="number" id="price" step="0.01" min="0" th:field="*{price}">

        <div class="form-buttons">
            <button type="submit" class="btn-save">Save</button>
            <a th:href="@{/wishlist/{id}(id=${wishList.wishList_id})}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
