<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wishlist</title>
    <link rel="stylesheet" th:href="@{/index.css}">
    <link rel="stylesheet" th:href="@{/create.css}">
</head>
<body>
<header>
    <h1> ♡ WishList</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/index}">My Wishlists</a>
    </nav>
</header>

<main class="create-page">
    <h2 th:text="${wishList.wishList_name}"> Title</h2>
    <p th:text="${wishList.wishList_description}"> Description</p>

    <div class="form-buttons">
        <a class="btn-save" th:href="@{/wishlist/{id}/wish/new(id=${wishList.wishList_id})}">Add wish</a>
        <a class="btn-cancel" th:href="@{/wishlist/edit/{id}(id=${wishList.wishList_id})}">Edit</a>
        <form th:action="@{/wishlist/delete}" method="post">
            <input type="hidden" name="wishListIds" th:value="${wishList.wishList_id}">
            <button class="btn-cancel" type="submit">Delete</button>
        </form>
    </div>

    <p th:if="${#lists.isEmpty(wishList.wishes)}">There are no wishes on the list yet.</p>

    <ul class="wish-list" th:unless="${#lists.isEmpty(wishList.wishes)}">
        <li class="form-card" th:each="wish : ${wishList.wishes}">
            <h3 th:text="${wish.wish_name}"> Name </h3>
            <p th:text="${wish.wish_description}"> Description</p>
            <p th:text="${wish.price}"> price</p>
            <p th:if="${wish.link != null and !wish.link.isBlank()}">
                <a th:href="${wish.link}">See product</a>
            </p>
            <form th:action="@{/wish/delete/{wish_id}(wish_id=${wish.wish_id})}" method="post">
                <button class="btn-cancel" type="submit">Delete</button>
            </form>
        </li>
    </ul>
</main>

<footer>
    <div class="container">
        <div class="footer-inner">
            <p>Copyrights &copy; 2026 All Rights Reserved by WishList</p>
        </div>
    </div>
</footer>

</body>
</html>
