<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wishlist</title>
    <link rel="stylesheet" th:href="@{/index.css}">

</head>
    <body>
        <header>
            <h1> ♡ WishList</h1>
                <nav>
                    <a th:href="@{/}">Home</a>
                    <a th:href="@{/index}">My Wishlists</a>
                </nav>
        </header>
        <main class="">
            <div class="">
                <div>
                   <h1 th:text="${wishList.wishList_name}"> Title</h1>
                    <p class="" th:text="${wishList.wishList_description}"> Description</p>
                </div>
                 <div class="">
                    <a class="" th:href="@{/wishList/edit/{wishList_id}(wishList_id=${wishList.wishList_id})}">Edit</a>
                     <form class="" th:action="@{/wishlist/delete}" method="post">
                         <input type="hidden" name="wishListIds" th:value="${wishList.wishList_id}">
                        <button class="" type="submit">Delete</button>
                     </form>
                </div>
            <div>
                <a th:href="@{/wishlist/{id}/wish/new(id=${wishList.wishList_id})}">Add wish</a>
            </div>

            <p> There are no wishes on the list yet. </p>

            <ul>
                <li>
                    <div>
                        <h3>
                            <span></span>
                        </h3>
                        <p> Description</p>
                        <p> price</p>
                        <p>
                            <a> link see product </a>
                        </p>
                    </div>
                    <div>
                        <a> Edit
                        </a>
                        <form with method="post">
                            <button></button>
                        </form>
                    </div>
                </li>
            </ul>
        </main>

    <footer>
        <div class="">
            <p class="footer-copy">Copyrights &copy; 2026 All Rights Reserved by WishList</p>
        </div>
    </footer>

    </body>
</html>
